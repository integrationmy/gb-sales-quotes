<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Fuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--accent:#436FA3;--ink:#1f2f45;--muted:#7a8799;}
  body.ipoh{--accent:#7d1f2e;--ink:#3a1219;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent;font-family:Inter,system-ui,sans-serif}
  body{display:flex;align-items:center}.card{width:100%}
  .card{padding:6px 4px 6px 14px;border-left:3px solid var(--accent);cursor:pointer;user-select:none}
  .tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}
  .q{font-family:Fraunces,Georgia,'Noto Serif SC','Songti SC',serif;font-weight:600;color:var(--ink);font-size:15px;line-height:1.38;
     opacity:0;transition:opacity .5s ease}
  .a{margin-top:5px;font-size:11.5px;line-height:1.4;color:var(--muted);opacity:0;transition:opacity .6s ease .15s}
  .a b{color:var(--ink);font-weight:600}
  .tr{margin-top:3px;font-size:12.5px;line-height:1.4;font-style:italic;color:var(--ink);opacity:0;transition:opacity .6s ease .1s}
  .show .q,.show .a,.show .tr{opacity:1}
  @media (max-width:380px){.q{font-size:14px}.tr{font-size:11.5px}.a{font-size:11px}}
  @media (min-width:600px){.q{font-size:16.5px}}
</style>
</head>
<body>
<div class="card" id="card" role="button" tabindex="0" aria-label="Show another tip" title="Tap for another tip">
  <div class="tag" id="tag">Pro tip</div>
  <div class="q" id="q"></div>
  <div class="tr" id="tr"></div>
  <div class="a" id="a"></div>
</div>
<script>
const Q = [
 // [tag, advice, author, credentials]  — quote marks only on verbatim quotes
 ["Referrals","Treat every customer as 250 people: each one influences roughly 250 others at weddings, funerals and coffee shops. Win one, win many — lose one, lose many.","Joe Girard","Guinness-record car salesman · 13,001 Chevrolets sold retail at a Detroit dealership"],
 ["Follow-up","Stay in touch after the sale. Girard sent every customer a card every month for years — his repeat and referral business grew until buyers queued to see him.","Joe Girard","Guinness-record car salesman · 13,001 Chevrolets sold retail at a Detroit dealership"],
 ["Prospecting","Hand out your business card everywhere you go. Every person you meet is a possible buyer or a possible referral.","Joe Girard","Guinness-record car salesman · 13,001 Chevrolets sold retail at a Detroit dealership"],
 ["Speed to lead","Call new leads within the hour. Firms that responded within an hour were nearly 7× more likely to qualify the lead than those that waited even one hour longer.","Harvard Business Review","“The Short Life of Online Sales Leads” · study of 2,241 US companies"],
 ["Discovery","Ask Situation, Problem, Implication and Need-payoff questions. Top performers in big-ticket sales ask more questions and talk about the customer's problem before the product.","Neil Rackham","Author of SPIN Selling · research on 35,000 sales calls"],
 ["Closing","Pushy closing techniques work on small purchases but backfire on big ones. In major sales, earn the yes by uncovering needs — not by pressure.","Neil Rackham","Author of SPIN Selling · research on 35,000 sales calls"],
 ["Insight","Teach, tailor, take control. The highest performers bring the customer a new insight about their own situation — not just product facts.","Matthew Dixon & Brent Adamson","The Challenger Sale · study of 6,000+ sales reps"],
 ["Objections","Every sale has five basic obstacles: no need, no money, no hurry, no desire, no trust. Find out which one you're facing before you answer.","Zig Ziglar","Sales trainer · author of Secrets of Closing the Sale"],
 ["Mindset","“You can have everything in life you want, if you will just help enough other people get what they want.”","Zig Ziglar","Sales trainer · author of Secrets of Closing the Sale"],
 ["Rapport","“A person's name is to that person the sweetest and most important sound in any language.” Use it — and remember it.","Dale Carnegie","Author of How to Win Friends and Influence People · 30M+ copies sold"],
 ["Rapport","“You can make more friends in two months by becoming interested in other people than you can in two years by trying to get other people interested in you.”","Dale Carnegie","Author of How to Win Friends and Influence People · 30M+ copies sold"],
 ["Listening","“Seek first to understand, then to be understood.” Diagnose before you prescribe — let the customer finish before you pitch.","Stephen R. Covey","Author of The 7 Habits of Highly Effective People"],
 ["Reciprocity","Give first. People feel obliged to return a favour — a cold drink, a useful charging guide or a genuine tip creates goodwill before you ask for anything.","Robert Cialdini","Author of Influence · Professor Emeritus, Arizona State University"],
 ["Social proof","People follow people like them. Tell buyers how many local families, colleagues or professionals already drive the model they're considering.","Robert Cialdini","Author of Influence · Professor Emeritus, Arizona State University"],
 ["Commitment","Small yeses lead to big yeses. A booked test drive or a written wish-list makes people far more likely to follow through.","Robert Cialdini","Author of Influence · Professor Emeritus, Arizona State University"],
 ["Scarcity","Opportunities seem more valuable when they're less available. Be honest about limited stock, colours or campaign deadlines — never invent them.","Robert Cialdini","Author of Influence · Professor Emeritus, Arizona State University"],
 ["Negotiation","Use tactical empathy. Label the customer's feelings — “It sounds like you're worried about resale value” — and watch the tension drop.","Chris Voss","Former FBI lead international kidnapping negotiator · author of Never Split the Difference"],
 ["Negotiation","Mirror: repeat the last one to three words the customer said, with a curious tone. They'll keep talking and tell you what really matters.","Chris Voss","Former FBI lead international kidnapping negotiator · author of Never Split the Difference"],
 ["Negotiation","Don't fear “no”. A “no” makes people feel safe and in control — and it starts the real conversation.","Chris Voss","Former FBI lead international kidnapping negotiator · author of Never Split the Difference"],
 ["Handover","People judge an experience by its peak and its end. Make the delivery moment unforgettable — it's what they'll retell.","Daniel Kahneman","Nobel laureate in Economics · author of Thinking, Fast and Slow"],
 ["Framing","Losses loom larger than gains. Show what staying with the old car costs every month, not just what the new one saves.","Daniel Kahneman","Nobel laureate in Economics · author of Thinking, Fast and Slow"],
 ["Anchoring","The first number sets the frame. Present the well-equipped variant first, then step down if needed.","Daniel Kahneman","Nobel laureate in Economics · author of Thinking, Fast and Slow"],
 ["Resilience","Optimistic salespeople sold 37% more than pessimistic ones in their first two years. Treat a rejection as temporary, specific and not about you.","Martin Seligman","Founder of positive psychology · MetLife sales study, Learned Optimism"],
 ["Resilience","Stay buoyant: before a call, ask yourself “Can I do this?” rather than pumping yourself up — then explain each rejection as temporary and specific.","Daniel H. Pink","Author of To Sell Is Human"],
 ["Buying","“People don't like to be sold — but they love to buy.” Create the atmosphere for buying instead of pushing a sale.","Jeffrey Gitomer","Sales trainer · author of The Little Red Book of Selling"],
 ["Know them","Know your customer better than the competitor does: family, job, hobbies, birthdays. Harvey Mackay's 66-question customer profile turned this into a system.","Harvey Mackay","Author of Swim with the Sharks Without Being Eaten Alive"],
 ["Approach","Approach each customer with the idea of helping them solve a problem or reach a goal — not of selling a product.","Brian Tracy","Sales trainer · author of The Psychology of Selling"],
 ["Why","“People don't buy what you do; they buy why you do it.” Lead with the reason it matters to their life.","Simon Sinek","Author of Start With Why"],
 ["Service","“There is only one boss. The customer.” They can fire everybody simply by spending their money elsewhere.","Sam Walton","Founder of Walmart"],
 ["Trust","“It takes 20 years to build a reputation and five minutes to ruin it.” Keep every small promise — the callback, the quote, the delivery date.","Warren Buffett","Chairman of Berkshire Hathaway"],
 ["Value","“Price is what you pay. Value is what you get.” Sell the value, not the discount.","Warren Buffett","Chairman of Berkshire Hathaway"],
 ["Customers","“Don't find customers for your products, find products for your customers.”","Seth Godin","Marketing author · Purple Cow, This Is Marketing"],
 ["Complaints","“Your most unhappy customers are your greatest source of learning.” Welcome complaints — fix them fast and you earn loyalty.","Bill Gates","Co-founder of Microsoft"],
 ["Quality","“Quality in a product or service is not what you put in. It is what the customer gets out of it.”","Peter Drucker","Father of modern management"],
 ["Courage","“You miss 100% of the shots you don't take.” Ask for the test drive. Ask for the order. Ask for the referral.","Wayne Gretzky","NHL all-time leading scorer"],
 ["Referrals", "Pay it forward: Girard paid past buyers a “bird-dog” fee for every customer they sent him. Make it easy and rewarding for happy owners to refer friends.", "Joe Girard", "Guinness-record car salesman · 13,001 Chevrolets sold retail at a Detroit dealership"],
 ["Records", "Keep a file on every customer — family, job, what they drive, when they might change. Girard's records turned one sale into a lifetime of them.", "Joe Girard", "Guinness-record car salesman · 13,001 Chevrolets sold retail at a Detroit dealership"],
 ["Discovery", "Ask implication questions: “What happens if the car breaks down on the way to work?” They make a hidden problem feel real and urgent.", "Neil Rackham", "Author of SPIN Selling · research on 35,000 sales calls"],
 ["Discovery", "Let the customer state the benefits. When they say “That would save me RM400 a month”, it convinces them far more than when you say it.", "Neil Rackham", "Author of SPIN Selling · research on 35,000 sales calls"],
 ["Tailor", "Tailor the message to each person in the decision: the driver wants performance, the spouse wants safety, the parent paying wants value.", "Matthew Dixon & Brent Adamson", "The Challenger Sale · study of 6,000+ sales reps"],
 ["Control", "Top performers are comfortable talking about money. Don't apologise for price — explain it with confidence.", "Matthew Dixon & Brent Adamson", "The Challenger Sale · study of 6,000+ sales reps"],
 ["Indecision", "Most lost deals aren't lost to a competitor — they're lost to indecision. Give a clear recommendation, limit the options, and take the risk off the table.", "Matthew Dixon & Ted McKenna", "The JOLT Effect · analysis of 2.5M+ recorded sales conversations"],
 ["Effortless", "Reducing customer effort builds more loyalty than “delighting” them. Make paperwork, payment and delivery as easy as possible.", "Matthew Dixon", "The Effortless Experience · CEB research on 97,000+ customers"],
 ["Listening", "“Let the other person do a great deal of the talking.”", "Dale Carnegie", "Author of How to Win Friends and Influence People · 30M+ copies sold"],
 ["Agreement", "Get the customer saying “yes, yes” early — start with things you both agree on before you discuss differences.", "Dale Carnegie", "Author of How to Win Friends and Influence People · 30M+ copies sold"],
 ["Respect", "Show respect for the customer's opinions. Never say “You're wrong.” Ask questions until they discover the better answer themselves.", "Dale Carnegie", "Author of How to Win Friends and Influence People · 30M+ copies sold"],
 ["Honesty", "“If you are wrong, admit it quickly and emphatically.” A fast apology wins more trust than a clever excuse.", "Dale Carnegie", "Author of How to Win Friends and Influence People · 30M+ copies sold"],
 ["Warmth", "Smile — and mean it. Carnegie made it a core principle: people warm to people who are glad to see them.", "Dale Carnegie", "Author of How to Win Friends and Influence People · 30M+ copies sold"],
 ["Win-win", "Think win-win. A deal where the customer feels beaten costs you referrals, reviews and the next sale.", "Stephen R. Covey", "Author of The 7 Habits of Highly Effective People"],
 ["Authority", "Establish expertise before you persuade. Mention your product training, experience and how many owners you've helped.", "Robert Cialdini", "Author of Influence · Professor Emeritus, Arizona State University"],
 ["Liking", "People say yes to people they like. Find genuine common ground — hometown, school, kids, football — and give sincere compliments.", "Robert Cialdini", "Author of Influence · Professor Emeritus, Arizona State University"],
 ["Contrast", "What you show first changes how the next thing feels. A higher-spec option shown first makes the right choice feel reasonable.", "Robert Cialdini", "Author of Influence · Professor Emeritus, Arizona State University"],
 ["Unity", "Shared identity is powerful. “People like us” — fellow Perakians, fellow parents, fellow business owners — builds instant trust.", "Robert Cialdini", "Author of Pre-Suasion and Influence · Professor Emeritus, Arizona State University"],
 ["Negotiation", "Ask calibrated “how” and “what” questions — “How can we make this work for you?” — so the customer helps solve the problem.", "Chris Voss", "Former FBI lead international kidnapping negotiator · author of Never Split the Difference"],
 ["Negotiation", "Run an accusation audit: say the customer's worries out loud first — “You might think I'm just trying to push a sale today…” — and they lose their sting.", "Chris Voss", "Former FBI lead international kidnapping negotiator · author of Never Split the Difference"],
 ["Negotiation", "Aim for “That's right.” When the customer says it, they feel truly understood — and that's when they move.", "Chris Voss", "Former FBI lead international kidnapping negotiator · author of Never Split the Difference"],
 ["Negotiation", "Use a calm, slow, late-night-radio voice when things get tense. Your tone can lower their guard faster than your words.", "Chris Voss", "Former FBI lead international kidnapping negotiator · author of Never Split the Difference"],
 ["Interests", "Focus on interests, not positions. “I want RM5,000 off” is a position; “I need the monthly instalment under RM1,800” is an interest you can solve.", "Roger Fisher & William Ury", "Getting to Yes · Harvard Negotiation Project"],
 ["Negotiation", "Separate the people from the problem. Be soft on the person and firm on the issue.", "Roger Fisher & William Ury", "Getting to Yes · Harvard Negotiation Project"],
 ["First offer", "First offers anchor negotiations. When you're well prepared, putting a confident number on the table first often leads to a better outcome.", "Adam Galinsky", "Professor at Columbia Business School · negotiation researcher"],
 ["Defaults", "Defaults are powerful — most people stick with the option that's preselected. Make your recommended package the starting point.", "Richard Thaler", "Nobel laureate in Economics · co-author of Nudge"],
 ["Choice", "Too many options freeze buyers. In the famous jam study, 30% bought from a table of 6 flavours versus 3% from 24. Narrow it to two or three.", "Sheena Iyengar", "Professor at Columbia Business School · author of The Art of Choosing"],
 ["Because", "Give a reason. In a classic Harvard study, adding “because…” to a request raised agreement from 60% to over 90%.", "Ellen Langer", "Harvard psychology professor · 1978 photocopier study"],
 ["Personality", "Ambiverts — people who balance talking and listening — outsold both strong extroverts and introverts in a study of sales reps.", "Adam Grant", "Wharton professor · Psychological Science, 2013"],
 ["Giving", "The most successful salespeople are givers who also protect their own time — generous with help, focused on outcomes.", "Adam Grant", "Wharton professor · author of Give and Take"],
 ["Grit", "Grit — passion and perseverance for long-term goals — predicted which salespeople stayed and succeeded better than talent did.", "Angela Duckworth", "University of Pennsylvania professor · author of Grit"],
 ["Mindset", "Treat every lost deal as feedback, not a verdict. People with a growth mindset improve faster because they learn from setbacks.", "Carol Dweck", "Stanford psychology professor · author of Mindset"],
 ["Systems", "“You do not rise to the level of your goals. You fall to the level of your systems.” Build a daily routine of calls and follow-ups.", "James Clear", "Author of Atomic Habits · 20M+ copies sold"],
 ["Clarity", "Help customers find the right problem, not just solve the one they mention. Clarity is often worth more than information.", "Daniel H. Pink", "Author of To Sell Is Human"],
 ["Attunement", "Step into the customer's shoes. Seeing the deal from their side helps you find solutions they'll actually say yes to.", "Daniel H. Pink", "Author of To Sell Is Human"],
 ["Enthusiasm", "Act enthusiastic and you'll become enthusiastic. Bettger credited this single change with turning his failing career around.", "Frank Bettger", "Author of How I Raised Myself from Failure to Success in Selling"],
 ["Wants", "Find out what people want, and help them get it. Bettger called it the most important secret of selling.", "Frank Bettger", "Author of How I Raised Myself from Failure to Success in Selling"],
 ["Persistence", "“I will persist until I succeed.”", "Og Mandino", "Author of The Greatest Salesman in the World · 50M+ copies sold"],
 ["Focus", "Build a “Dream 100”: list your best potential buyers — fleets, businesses, community leaders — and contact them regularly until they buy.", "Chet Holmes", "Author of The Ultimate Sales Machine"],
 ["Ambition", "Set targets ten times higher than you think you need — and take ten times the action. Cardone learned this selling cars.", "Grant Cardone", "Former car salesman · author of The 10X Rule and Sell or Be Sold"],
 ["Prospecting", "Block time for prospecting and protect it like a customer appointment. New business doesn't happen in leftover time.", "Mike Weinberg", "Sales consultant · author of New Sales. Simplified."],
 ["Simplicity", "Busy buyers want it simple. Keep your message clear, show you're invaluable, align with what matters to them, and make it a priority.", "Jill Konrath", "Author of SNAP Selling"],
 ["Hard first", "Eat that frog: make your hardest call first thing in the morning. Everything after it feels easier.", "Brian Tracy", "Sales trainer · author of Eat That Frog!"],
 ["Words", "Choose softer words. Say “paperwork” instead of “contract” and “investment” instead of “cost” — the right words lower the pressure.", "Tom Hopkins", "Sales trainer · author of How to Master the Art of Selling"],
 ["Lifetime", "A single loyal customer can be worth hundreds of thousands in cars, servicing and referrals. Sewell put the figure at US$332,000 per customer.", "Carl Sewell", "Cadillac dealer · author of Customers for Life"],
 ["Lifetime", "Ask customers what they want, then give it to them again and again. That's how one sale becomes a customer for life.", "Carl Sewell", "Cadillac dealer · author of Customers for Life"],
 ["Guests", "Treat each customer as you would a guest in your home.", "The Lexus Covenant", "Lexus's founding promise to customers, 1989"],
 ["Service", "“We are Ladies and Gentlemen serving Ladies and Gentlemen.” Respect yourself and the customer equally.", "Horst Schulze", "Co-founder of The Ritz-Carlton Hotel Company"],
 ["Anticipate", "Fulfil even the unexpressed wishes of your customers. Notice the child seat, the golf bag, the long commute — and act on it.", "Horst Schulze", "Co-founder of The Ritz-Carlton Hotel Company"],
 ["Hospitality", "“Service is the technical delivery of a product. Hospitality is how the delivery of that product makes its recipient feel.”", "Danny Meyer", "Founder of Union Square Hospitality Group · author of Setting the Table"],
 ["Importance", "“Pretend that every single person you meet has a sign around his or her neck that says, ‘Make me feel important.’”", "Mary Kay Ash", "Founder of Mary Kay Cosmetics"],
 ["Respect", "“The consumer isn't a moron; she is your wife.” Never underestimate how much your customer already knows.", "David Ogilvy", "Founder of Ogilvy & Mather · “the father of advertising”"],
 ["Informed", "Today's buyers research online before they ever visit — the “Zero Moment of Truth”. Add value beyond what they've already read.", "Jim Lecinski", "Google · author of Winning the Zero Moment of Truth"],
 ["Loyalty", "Raising customer retention by just 5% can raise profits by 25% to 95%. Your past buyers are your best future buyers.", "Frederick Reichheld", "Bain & Company · creator of the Net Promoter Score"],
 ["Promoters", "Ask every buyer: “How likely are you to recommend us?” Promoters drive growth — and every low score is a fix waiting to happen.", "Frederick Reichheld", "Bain & Company · creator of the Net Promoter Score"],
 ["Persuasion", "Persuade with ethos, pathos and logos: your credibility, the customer's emotions, and clear logic. All three, every time.", "Aristotle", "Greek philosopher · author of Rhetoric"],
 ["Customers", "“The purpose of business is to create a customer.”", "Peter Drucker", "Father of modern management"],
 ["Customers", "Start with the customer and work backwards. Begin every conversation with their needs, not your stock list.", "Jeff Bezos", "Founder of Amazon"],
 ["Word of mouth", "“If you make customers unhappy in the physical world, they might each tell 6 friends. If you make customers unhappy on the Internet, they can each tell 6,000.”", "Jeff Bezos", "Founder of Amazon"],
 ["Expectations", "Exceed your customers' expectations. If you do, they'll come back over and over.", "Sam Walton", "Founder of Walmart · Sam's Rules for Building a Business"],
 ["Referrals", "“The best advertising is done by satisfied customers.”", "Philip Kotler", "Professor at Kellogg School of Management · “father of modern marketing”"],
 ["Stories", "“People like us do things like this.” Show customers that people like them already made this choice.", "Seth Godin", "Marketing author · This Is Marketing"],
 ["Promise", "Under-promise and over-deliver. A delivery date you beat is worth more than a fast one you miss.", "Tom Peters", "Co-author of In Search of Excellence"],
 ["Growth", "What got you here won't get you there. The habits that made you a good salesperson may not make you a great one.", "Marshall Goldsmith", "Executive coach · author of What Got You Here Won't Get You There"],
 ["Action", "“Well done is better than well said.”", "Benjamin Franklin", "US founding father · Poor Richard's Almanack, 1737"]
];
(function(){
  const p = new URLSearchParams(location.search);
  if ((p.get("outlet")||"").toLowerCase()==="ipoh") document.body.classList.add("ipoh");
  if (p.get("color")) document.documentElement.style.setProperty("--accent","#"+p.get("color").replace(/[^0-9a-f]/gi,""));
  const KEY="gbq_bag";
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function save(b){try{localStorage.setItem(KEY,JSON.stringify(b))}catch(e){}}
  // Shuffle-bag: every quote shows once before any repeats
  function next(){
    let bag=load().filter(i=>i<Q.length);
    if(!bag.length){bag=[...Q.keys()];for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}
    const i=bag.pop();save(bag);return Q[i];
  }
  const card=document.getElementById("card");
  function show(){
    const [t,q,a,c,tr]=next();
    card.classList.remove("show");
    setTimeout(()=>{
      document.getElementById("q").textContent=q;const te=document.getElementById("tr");te.textContent=tr||"";te.style.display=tr?"block":"none";
      const el=document.getElementById("a");el.textContent="";const nb=document.createElement("b");nb.textContent=a;el.append(nb," · "+c);
      document.getElementById("tag").textContent=t.startsWith("BYD")?t:"Pro tip · "+t;
      card.classList.add("show");
    },card.dataset.ready?200:0);
    card.dataset.ready=1;
  }
  card.addEventListener("click",show);
  card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();show()}});
  show();
})();
</script>
</body>
</html>
