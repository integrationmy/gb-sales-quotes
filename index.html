<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Fuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--accent:#436FA3;--ink:#1f2f45;--soft:#f7f3ea;--muted:#6b7a8f;}
  body.ipoh{--accent:#7d1f2e;--ink:#3a1219;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent;font-family:Inter,system-ui,sans-serif}
  .card{height:100%;min-height:150px;display:flex;flex-direction:column;justify-content:center;
    padding:18px 22px 16px;border-radius:14px;background:var(--soft);
    border-left:6px solid var(--accent);cursor:pointer;user-select:none;position:relative;overflow:hidden}
  .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:8px}
  .q{font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--ink);
     font-size:clamp(15px,3.9vw,20px);line-height:1.32;opacity:0;transform:translateY(6px);
     transition:opacity .5s ease,transform .5s ease}
  .a{margin-top:8px;font-size:13px;font-weight:600;color:var(--muted);font-weight:500;opacity:0;transition:opacity .6s ease .15s}
  .c{margin-top:2px;font-size:11.5px;color:var(--muted);opacity:0;transition:opacity .6s ease .2s;padding-right:90px}
  .show .c{opacity:.85}
  .show .q{opacity:1;transform:none}.show .a{opacity:1}
  .hint{position:absolute;right:14px;bottom:10px;font-size:11px;color:var(--muted);opacity:.7}
  .mark{position:absolute;right:10px;top:-18px;font-family:Fraunces,Georgia,serif;font-size:110px;color:var(--accent);opacity:.08;line-height:1}
</style>
</head>
<body>
<div class="card" id="card" role="button" tabindex="0" aria-label="Show another quote">
  <div class="mark" aria-hidden="true">&ldquo;</div>
  <div class="tag" id="tag">Pro tip</div>
  <div class="q" id="q"></div>
  <div class="a" id="a"></div>
  <div class="c" id="c"></div>
  <div class="hint">Tap for another</div>
</div>
<script>
const Q = [
 // [tag, advice, author, credentials]  — quote marks only on verbatim quotes
 ["Referrals","Treat every customer as 250 people: each one influences roughly 250 others at weddings, funerals and coffee shops. Win one, win many — lose one, lose many.","Joe Girard","Guinness-record car salesman · 13,001 Chevrolets sold retail at a Detroit dealership"],
 ["Follow-up","Stay in touch after the sale. Girard sent every customer a card every month for years — his repeat and referral business grew until buyers queued to see him.","Joe Girard","Guinness-record car salesman · 13,001 Chevrolets sold retail at a Detroit dealership"],
 ["Prospecting","Hand out your business card everywhere you go. Every person you meet is a possible buyer or a possible referral.","Joe Girard","Guinness-record car salesman · 13,001 Chevrolets sold retail at a Detroit dealership"],
 ["Speed to lead","Call new leads within the hour. Firms that responded within an hour were nearly 7× more likely to qualify the lead than those that waited even one hour longer.","Harvard Business Review","“The Short Life of Online Sales Leads” · study of 2,241 US companies"],
 ["Discovery","Ask Situation, Problem, Implication and Need-payoff questions. Top performers in big-ticket sales ask more questions and talk about the customer's problem before the product.","Neil Rackham","Author of SPIN Selling · research on 35,000 sales calls"],
 ["Closing","Pushy closing techniques work on small purchases but backfire on big ones. In major sales, earn the yes by uncovering needs — not by pressure.","Neil Rackham","Author of SPIN Selling · research on 35,000 sales calls"],
 ["Insight","Teach, tailor, take control. The highest performers bring the customer a new insight about their own situation — not just product facts.","Matthew Dixon & Brent Adamson","The Challenger Sale · study of 6,000+ sales reps"],
 ["Objections","Every sale has five basic obstacles: no need, no money, no hurry, no desire, no trust. Find out which one you're facing before you answer.","Zig Ziglar","Sales trainer · author of Secrets of Closing the Sale"],
 ["Mindset","“You can have everything in life you want, if you will just help enough other people get what they want.”","Zig Ziglar","Sales trainer · author of Secrets of Closing the Sale"],
 ["Rapport","“A person's name is to that person the sweetest and most important sound in any language.” Use it — and remember it.","Dale Carnegie","Author of How to Win Friends and Influence People · 30M+ copies sold"],
 ["Rapport","“You can make more friends in two months by becoming interested in other people than you can in two years by trying to get other people interested in you.”","Dale Carnegie","Author of How to Win Friends and Influence People · 30M+ copies sold"],
 ["Listening","“Seek first to understand, then to be understood.” Diagnose before you prescribe — let the customer finish before you pitch.","Stephen R. Covey","Author of The 7 Habits of Highly Effective People"],
 ["Reciprocity","Give first. People feel obliged to return a favour — a cold drink, a useful charging guide or a genuine tip creates goodwill before you ask for anything.","Robert Cialdini","Author of Influence · Professor Emeritus, Arizona State University"],
 ["Social proof","People follow people like them. Tell buyers how many local families, colleagues or professionals already drive the model they're considering.","Robert Cialdini","Author of Influence · Professor Emeritus, Arizona State University"],
 ["Commitment","Small yeses lead to big yeses. A booked test drive or a written wish-list makes people far more likely to follow through.","Robert Cialdini","Author of Influence · Professor Emeritus, Arizona State University"],
 ["Scarcity","Opportunities seem more valuable when they're less available. Be honest about limited stock, colours or campaign deadlines — never invent them.","Robert Cialdini","Author of Influence · Professor Emeritus, Arizona State University"],
 ["Negotiation","Use tactical empathy. Label the customer's feelings — “It sounds like you're worried about resale value” — and watch the tension drop.","Chris Voss","Former FBI lead international kidnapping negotiator · author of Never Split the Difference"],
 ["Negotiation","Mirror: repeat the last one to three words the customer said, with a curious tone. They'll keep talking and tell you what really matters.","Chris Voss","Former FBI lead international kidnapping negotiator · author of Never Split the Difference"],
 ["Negotiation","Don't fear “no”. A “no” makes people feel safe and in control — and it starts the real conversation.","Chris Voss","Former FBI lead international kidnapping negotiator · author of Never Split the Difference"],
 ["Handover","People judge an experience by its peak and its end. Make the delivery moment unforgettable — it's what they'll retell.","Daniel Kahneman","Nobel laureate in Economics · author of Thinking, Fast and Slow"],
 ["Framing","Losses loom larger than gains. Show what staying with the old car costs every month, not just what the new one saves.","Daniel Kahneman","Nobel laureate in Economics · author of Thinking, Fast and Slow"],
 ["Anchoring","The first number sets the frame. Present the well-equipped variant first, then step down if needed.","Daniel Kahneman","Nobel laureate in Economics · author of Thinking, Fast and Slow"],
 ["Resilience","Optimistic salespeople sold 37% more than pessimistic ones in their first two years. Treat a rejection as temporary, specific and not about you.","Martin Seligman","Founder of positive psychology · MetLife sales study, Learned Optimism"],
 ["Resilience","Stay buoyant: before a call, ask yourself “Can I do this?” rather than pumping yourself up — then explain each rejection as temporary and specific.","Daniel H. Pink","Author of To Sell Is Human"],
 ["Buying","“People don't like to be sold — but they love to buy.” Create the atmosphere for buying instead of pushing a sale.","Jeffrey Gitomer","Sales trainer · author of The Little Red Book of Selling"],
 ["Know them","Know your customer better than the competitor does: family, job, hobbies, birthdays. Harvey Mackay's 66-question customer profile turned this into a system.","Harvey Mackay","Author of Swim with the Sharks Without Being Eaten Alive"],
 ["Approach","Approach each customer with the idea of helping them solve a problem or reach a goal — not of selling a product.","Brian Tracy","Sales trainer · author of The Psychology of Selling"],
 ["Why","“People don't buy what you do; they buy why you do it.” Lead with the reason it matters to their life.","Simon Sinek","Author of Start With Why"],
 ["Service","“There is only one boss. The customer.” They can fire everybody simply by spending their money elsewhere.","Sam Walton","Founder of Walmart"],
 ["Trust","“It takes 20 years to build a reputation and five minutes to ruin it.” Keep every small promise — the callback, the quote, the delivery date.","Warren Buffett","Chairman of Berkshire Hathaway"],
 ["Value","“Price is what you pay. Value is what you get.” Sell the value, not the discount.","Warren Buffett","Chairman of Berkshire Hathaway"],
 ["Customers","“Don't find customers for your products, find products for your customers.”","Seth Godin","Marketing author · Purple Cow, This Is Marketing"],
 ["Complaints","“Your most unhappy customers are your greatest source of learning.” Welcome complaints — fix them fast and you earn loyalty.","Bill Gates","Co-founder of Microsoft"],
 ["Quality","“Quality in a product or service is not what you put in. It is what the customer gets out of it.”","Peter Drucker","Father of modern management"],
 ["Courage","“You miss 100% of the shots you don't take.” Ask for the test drive. Ask for the order. Ask for the referral.","Wayne Gretzky","NHL all-time leading scorer"]
];
(function(){
  const p = new URLSearchParams(location.search);
  if ((p.get("outlet")||"").toLowerCase()==="ipoh") document.body.classList.add("ipoh");
  if (p.get("color")) document.documentElement.style.setProperty("--accent","#"+p.get("color").replace(/[^0-9a-f]/gi,""));
  const KEY="gbq_bag";
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function save(b){try{localStorage.setItem(KEY,JSON.stringify(b))}catch(e){}}
  // Shuffle-bag: every quote shows once before any repeats
  function next(){
    let bag=load().filter(i=>i<Q.length);
    if(!bag.length){bag=[...Q.keys()];for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}
    const i=bag.pop();save(bag);return Q[i];
  }
  const card=document.getElementById("card");
  function show(){
    const [t,q,a,c]=next();
    card.classList.remove("show");
    setTimeout(()=>{
      document.getElementById("q").textContent=q;
      document.getElementById("a").textContent="— "+a;document.getElementById("c").textContent=c;
      document.getElementById("tag").textContent="Pro tip · "+t;
      card.classList.add("show");
    },card.dataset.ready?250:0);
    card.dataset.ready=1;
  }
  card.addEventListener("click",show);
  card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();show()}});
  show();
})();
</script>
</body>
</html>
